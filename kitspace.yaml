summary: High-efficiency step-down converter based on the LM3485 PFET  buck controller.
  Input voltage range is 4.5 V to 16 V. Output voltage can be  selected by jumpers
  as 3.3 V or 5 V, or configured as a custom voltage using  an external resistor.
